[bumpversion]
current_version = 1.0.0
commit = True
tag = True

[bumpversion:file:core/identity.py]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"

[bumpversion:file:AstralNexus/CHANGELOG.md]
search = ## [Unreleased]
replace = ## [Unreleased]
	
	## [{new_version}] - {now:%Y-%m-%d}
