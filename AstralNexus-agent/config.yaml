# AstralNexus Configuration File

# Model configuration
model:
  default: "gpt-4"
  providers:
    - name: "openai"
      api_key: "${OPENAI_API_KEY}"
    - name: "anthropic"
      api_key: "${ANTHROPIC_API_KEY}"

# Task execution settings
execution:
  max_concurrent_tasks: 5
  task_timeout_seconds: 3600
  retry_attempts: 3

# Resource allocation
resources:
  local:
    privacy: high
    cost: low
    latency: low
    capabilities: 
      - file_operations
      - terminal_access
      - light_reasoning
  edge:
    privacy: medium
    cost: medium
    latency: medium
    capabilities:
      - retrieval
      - medium_reasoning
  cloud:
    privacy: low
    cost: high
    latency: variable
    capabilities:
      - planning
      - long_context
      - hard_reasoning

# Memory settings
memory:
  short_term_capacity: 100
  medium_term_capacity: 1000
  long_term_capacity: 10000
  compression_threshold_hours: 24

# Tracing and logging
tracing:
  enabled: true
  level: "INFO"
  output_directory: "./logs"

# Dashboard settings
dashboard:
  port: 8080
  host: "localhost"
  enable_https: false

# Fault injection settings
fault_injection:
  enabled: false
  default_probability: 0.01
  fault_types:
    - requirement_change
    - node_failure
    - tool_failure
    - memory_loss
    - resource_degradation